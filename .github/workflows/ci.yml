# pomme CI — per-stage green on every push.
#
# Mirrors the local pipeline (Makefile + scripts/ci-local.sh): each stage is
# its own job so a red stage shows red on its own card — seven stages since
# 2026-09-29: gaster, pongoos, kernel, images, m1n1, kernel-4k, images-4k
# (the 4K pair is the A7/A8/A8X page-size flavor; the m1n1 stage builds the
# pongoOS-bootm chainloader for those devices). A stage whose
# tooling/<stage>/build.sh does not exist yet reports SKIP and exits 0 —
# its job stays green until the stage lands, then starts building for real.
#
# Dependency notes are read from each build.sh (2026-09-29; corrected after
# the first hosted run — see the per-job comments):
#   gaster  (tooling/gaster/build.sh): gcc|clang, make, git, xxd, pkg-config,
#           libusb-1.0-0-dev (correct noble package name; the first hosted
#           run proved "libusb-1.0-dev" is not locatable), libssl-dev
#           (OpenSSL 3 headers), timeout, stdbuf.
#   pongoos (tooling/pongoos/build.sh): clang, host cc, make, git, curl,
#           dpkg-deb, llvm-ar-16/17/18 (falls back to -18), a system libLTO,
#           and the two checksum-pinned checkra1n debs it downloads itself
#           (ld64 + cctools-strip, extracted to $POMME_TOOLCHAIN_DIR — the
#           default path is the build author's home dir, so CI exports the
#           override the script provides).
#   kernel  (tooling/kernel/build.sh): make bc bison flex depmod/kmod zstd +
#           a sha256-pinned Bootlin aarch64 toolchain. build.sh self-fetches
#           the pinned tarball (sha256-checked) when absent; its default
#           location is $HOME/toolchains (never a hardcoded user path — the
#           first hosted run proved that default dies on runners), and the
#           job exports POMME_TOOLCHAIN_DIR to redirect into the workspace.
#   images  (tooling/images/build.sh): e2fsprogs, cpio, fakeroot, kmod,
#           file, busybox-static, curl; downloads pinned Alpine minirootfs +
#           busybox-static itself (sha256-verified).
#   verify  runs scripts/manifest.sh + scripts/verify.sh (bash + python3).

name: ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gaster:
    name: stage gaster
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install gaster build deps (mirrors tooling/gaster/build.sh)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libusb-1.0-0-dev libssl-dev xxd pkg-config

      - name: Build gaster (SKIP if build.sh absent)
        shell: bash
        run: |
          set -o pipefail
          if [ ! -f tooling/gaster/build.sh ]; then
            echo "SKIP: tooling/gaster/build.sh not present yet"
            exit 0
          fi
          mkdir -p evidence/builds artifacts/gaster
          bash tooling/gaster/build.sh 2>&1 | tee evidence/builds/gaster_ci.log

      - name: Upload gaster artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pomme-gaster
          path: artifacts/gaster/
          if-no-files-found: ignore

      - name: Upload gaster build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pomme-log-gaster
          path: evidence/builds/gaster_ci.log
          if-no-files-found: ignore

  pongoos:
    name: stage pongoos
    runs-on: ubuntu-24.04
    env:
      # tooling/pongoos/build.sh:30 defaults to the build author's home dir;
      # it supports this override, so CI redirects the extracted Apple
      # ld64/cctools-strip prefix into the workspace.
      POMME_TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/checkra1n-cctools
    steps:
      - uses: actions/checkout@v4

      - name: Install pongoOS build deps (mirrors tooling/pongoos/build.sh)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm gcc make file curl

      - name: Build pongoOS (SKIP if build.sh absent)
        shell: bash
        run: |
          set -o pipefail
          if [ ! -f tooling/pongoos/build.sh ]; then
            echo "SKIP: tooling/pongoos/build.sh not present yet"
            exit 0
          fi
          mkdir -p evidence/builds artifacts/pongoos
          bash tooling/pongoos/build.sh 2>&1 | tee evidence/builds/pongoos_ci.log

      - name: Upload pongoOS artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pomme-pongoos
          path: artifacts/pongoos/
          if-no-files-found: ignore

      - name: Upload pongoOS build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pomme-log-pongoos
          path: evidence/builds/pongoos_ci.log
          if-no-files-found: ignore

  kernel:
    name: stage kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # tooling/kernel/build.sh:40 supports JOBS; GH runners have 4 cores.
      JOBS: "4"
      # First CI run (2026-09-29) proved build.sh's $HOME/toolchains default
      # would fetch the toolchain into the runner HOME — redirected into the
      # workspace so the artifact is co-located and clean per run. The pinned
      # tarball is sha256-checked by build.sh on every fetch regardless.
      POMME_TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/aarch64
    steps:
      - uses: actions/checkout@v4

      # Deps mirrored from tooling/kernel/build.sh preflight (make bc bison
      # flex depmod/kmod zstd) + its sanity checks (file, fdtdump).
      # Toolchain: build.sh self-fetches the sha256-pinned Bootlin aarch64
      # toolchain when ${POMME_TOOLCHAIN_DIR} has no cross gcc. Local cache
      # reuse would need actions/cache keyed on the pinned tarball sha; left
      # uncached, the job downloads ~100 MB per run.
      - name: Install kernel build deps (mirrors tooling/kernel/build.sh)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev kmod zstd file device-tree-compiler \
            perl xz-utils

      - name: Build kernel (SKIP if build.sh absent)
        shell: bash
        run: |
          set -o pipefail
          if [ ! -f tooling/kernel/build.sh ]; then
            echo "SKIP: tooling/kernel/build.sh not present yet"
            exit 0
          fi
          mkdir -p evidence/builds artifacts/kernel
          bash tooling/kernel/build.sh 2>&1 | tee evidence/builds/kernel_ci.log

      - name: Upload kernel artifacts (Image, dtbs, modules)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pomme-kernel
          path: artifacts/kernel/
          if-no-files-found: ignore

      - name: Upload kernel build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pomme-log-kernel
          path: evidence/builds/kernel_ci.log
          if-no-files-found: ignore

  m1n1:
    name: stage m1n1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      POMME_TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/aarch64
    steps:
      - uses: actions/checkout@v4

      # tooling/m1n1/build.sh needs: git make jq python3 file + rustc/rustup
      # (aarch64-unknown-none-softfloat target — build.sh adds it when missing)
      # + the pinned Bootlin aarch64 cross-GCC, which it locates under
      # ${POMME_TOOLCHAIN_DIR} (self-fetch of the tarball is the kernel job's
      # pattern; mirrored here so the job owns its toolchain like kernel does).
      - name: Install m1n1 build deps
        run: |
          if ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
            echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          fi

      - name: Fetch pinned Bootlin aarch64 toolchain (sha256-checked)
        run: |
          set -euo pipefail
          DEST="${POMME_TOOLCHAIN_DIR}"
          ROOT="$(dirname "${DEST}")"
          mkdir -p "${DEST}" "${ROOT}"
          TARBALL="${ROOT}/aarch64-toolchain.tar.xz"
          if [ ! -x "${DEST}/aarch64--glibc--stable-2026.08-1/bin/aarch64-buildroot-linux-gnu-gcc" ]; then
            curl -fSL --retry 3 -o "${TARBALL}" \
              "https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64/tarballs/aarch64--glibc--stable-2026.08-1.tar.xz"
            echo "0213efac9b5577f20d58de9431960a191347ffc2257b27ffe7250522bf1f7867  ${TARBALL}" | sha256sum -c -
            # extract INTO DEST (the tarball's top-level dir is the toolchain root)
            tar -xf "${TARBALL}" -C "${DEST}"
          fi
          "${DEST}/aarch64--glibc--stable-2026.08-1/bin/aarch64-buildroot-linux-gnu-gcc" --version | head -1

      - name: Build m1n1 (SKIP if build.sh absent)
        shell: bash
        run: |
          set -o pipefail
          if [ ! -f tooling/m1n1/build.sh ]; then
            echo "SKIP: tooling/m1n1/build.sh not present yet"
            exit 0
          fi
          mkdir -p evidence/builds artifacts/m1n1
          bash tooling/m1n1/build.sh 2>&1 | tee evidence/builds/m1n1_ci.log

      - name: Upload m1n1 artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pomme-m1n1
          path: artifacts/m1n1/
          if-no-files-found: ignore

      - name: Upload m1n1 build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pomme-log-m1n1
          path: evidence/builds/m1n1_ci.log
          if-no-files-found: ignore

  kernel-4k:
    name: stage kernel-4k
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      JOBS: "4"
      POMME_KERNEL_FLAVOR: "4k"
      POMME_TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install kernel-4k build deps (mirrors tooling/kernel/build.sh)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev kmod zstd file device-tree-compiler \
            perl xz-utils

      - name: Build kernel-4k (SKIP if build.sh absent)
        shell: bash
        run: |
          set -o pipefail
          if [ ! -f tooling/kernel/build.sh ]; then
            echo "SKIP: tooling/kernel/build.sh not present yet"
            exit 0
          fi
          mkdir -p evidence/builds artifacts/kernel-4k
          bash tooling/kernel/build.sh 2>&1 | tee evidence/builds/kernel-4k_ci.log

      - name: Upload kernel-4k artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pomme-kernel-4k
          path: artifacts/kernel-4k/
          if-no-files-found: ignore

      - name: Upload kernel-4k build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pomme-log-kernel-4k
          path: evidence/builds/kernel-4k_ci.log
          if-no-files-found: ignore

  images:
    name: stage images
    runs-on: ubuntu-24.04
    needs: kernel
    steps:
      - uses: actions/checkout@v4

      # Deps mirrored from tooling/images/build.sh preflight: cpio gzip
      # mke2fs e2fsck debugfs (e2fsprogs) file tar depmod (kmod) fakeroot
      # busybox (smoke 1), curl (pinned downloads). qemu-user-static is
      # optional (build.sh skips its smoke test with a note when absent).
      - name: "Install images deps (e2fsprogs = mke2fs family)"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            e2fsprogs cpio fakeroot kmod file busybox-static curl

      - name: Download kernel artifact (for modules)
        if: ${{ needs.kernel.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: pomme-kernel
          path: artifacts/kernel/

      - name: Build images (SKIP if build.sh absent)
        shell: bash
        run: |
          set -o pipefail
          if [ ! -f tooling/images/build.sh ]; then
            echo "SKIP: tooling/images/build.sh not present yet"
            exit 0
          fi
          mkdir -p evidence/builds artifacts/images
          bash tooling/images/build.sh 2>&1 | tee evidence/builds/images_ci.log

      - name: Upload images artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pomme-images
          path: artifacts/images/
          if-no-files-found: ignore

      - name: Upload images build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pomme-log-images
          path: evidence/builds/images_ci.log
          if-no-files-found: ignore

  images-4k:
    name: stage images-4k
    runs-on: ubuntu-24.04
    needs: kernel-4k
    env:
      POMME_KERNEL_FLAVOR: "4k"
    steps:
      - uses: actions/checkout@v4

      - name: "Install images-4k deps (e2fsprogs = mke2fs family)"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            e2fsprogs cpio fakeroot kmod file busybox-static curl

      - name: Download kernel-4k artifact (for modules)
        if: ${{ needs.kernel-4k.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: pomme-kernel-4k
          path: artifacts/kernel-4k/

      - name: Build images-4k (SKIP if build.sh absent)
        shell: bash
        run: |
          set -o pipefail
          if [ ! -f tooling/images/build.sh ]; then
            echo "SKIP: tooling/images/build.sh not present yet"
            exit 0
          fi
          mkdir -p evidence/builds artifacts/images-4k
          bash tooling/images/build.sh 2>&1 | tee evidence/builds/images-4k_ci.log

      - name: Upload images-4k artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pomme-images-4k
          path: artifacts/images-4k/
          if-no-files-found: ignore

      - name: Upload images-4k build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pomme-log-images-4k
          path: evidence/builds/images-4k_ci.log
          if-no-files-found: ignore

  verify:
    name: verify manifest + evidence
    runs-on: ubuntu-24.04
    needs: [gaster, pongoos, kernel, images, m1n1, kernel-4k, images-4k]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      # First CI run (2026-09-29): with a stage red, this job ran manifest.sh
      # against the COMMITTED provenance of a stage whose artifacts never
      # arrived and failed with a confusing "referenced artifact missing".
      # Gate on the stage results first so the failure message names the
      # actual cause. Extended 2026-09-29 (second hosted run) for the m1n1
      # stage and the 4K flavor pair.
      - name: Fail fast if any stage job failed
        env:
          R_GASTER: ${{ needs.gaster.result }}
          R_PONGOOS: ${{ needs.pongoos.result }}
          R_KERNEL: ${{ needs.kernel.result }}
          R_IMAGES: ${{ needs.images.result }}
          R_M1N1: ${{ needs.m1n1.result }}
          R_KERNEL4K: ${{ needs.kernel-4k.result }}
          R_IMAGES4K: ${{ needs.images-4k.result }}
        run: |
          failed=""
          [ "${R_GASTER}" = "success" ] || failed="$failed gaster"
          [ "${R_PONGOOS}" = "success" ] || failed="$failed pongoos"
          [ "${R_KERNEL}" = "success" ] || failed="$failed kernel"
          [ "${R_IMAGES}" = "success" ] || failed="$failed images"
          [ "${R_M1N1}" = "success" ] || failed="$failed m1n1"
          [ "${R_KERNEL4K}" = "success" ] || failed="$failed kernel-4k"
          [ "${R_IMAGES4K}" = "success" ] || failed="$failed images-4k"
          if [ -n "${failed}" ]; then
            echo "stage(s)$failed did not succeed - verify gates the full evidence chain and needs all of them green"
            exit 1
          fi
          echo "all seven stage jobs succeeded"

      # artifacts/* are gitignored, so the built artifacts and their
      # provenance.json files must be pulled from the stage jobs before
      # manifest/verify can check anything real.
      - name: Download gaster artifact
        if: ${{ needs.gaster.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: pomme-gaster
          path: artifacts/gaster/

      - name: Download pongoOS artifact
        if: ${{ needs.pongoos.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: pomme-pongoos
          path: artifacts/pongoos/

      - name: Download kernel artifact
        if: ${{ needs.kernel.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: pomme-kernel
          path: artifacts/kernel/

      - name: Download images artifact
        if: ${{ needs.images.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: pomme-images
          path: artifacts/images/

      - name: Download m1n1 artifact
        if: ${{ needs.m1n1.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: pomme-m1n1
          path: artifacts/m1n1/

      - name: Download kernel-4k artifact
        if: ${{ needs.kernel-4k.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: pomme-kernel-4k
          path: artifacts/kernel-4k/

      - name: Download images-4k artifact
        if: ${{ needs.images-4k.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: pomme-images-4k
          path: artifacts/images-4k/

      - name: Generate artifacts/manifest.json
        run: bash scripts/manifest.sh

      # rootfs.img is non-reproducible by design (fresh UUID every build), so
      # CI-rebuilt artifacts always hash differently from the pushed ones.
      # Both evidence gates therefore run against the PUSHED state:
      #   1. regenerate the manifest from the CI-built artifacts and verify
      #      artifact integrity with the state-dependent checks skipped
      #      (POMME_VERIFY_SKIP_DOC_GATE=1 — docs and producing logs describe
      #      the pushed commit, not CI-rebuilt bytes);
      #   2. restore the pushed manifest and run every gate against it:
      #      doc-hash allowlist, doc-sync staleness, log↔hash cross-check.
      - name: Verify CI-built artifacts against regenerated manifest
        env:
          POMME_VERIFY_SKIP_DOC_GATE: "1"
        run: bash scripts/verify.sh

      - name: Restore pushed manifest
        run: git show HEAD:artifacts/manifest.json > artifacts/manifest.json

      - name: Gates against the pushed state
        run: |
          python3 scripts/check_doc_hashes.py
          python3 scripts/update_doc_hashes.py --check
          python3 scripts/check_log_hashes.py

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pomme-manifest
          path: artifacts/manifest.json
          if-no-files-found: error
